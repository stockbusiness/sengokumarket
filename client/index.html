<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C97A90" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 初回表示をブロックしないよう、フォントCSSは非同期で読み込む(表示速度改善)。
         display=swapによりフォント読み込み完了までは代替フォントで即座に表示される。 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      />
    </noscript>
    <title>千ノ国</title>
    <meta name="description" content="千ノ国 評議員デジタル会員証のお申し込みはこちら" />

    <!-- OGP / SNS共有用(仕様書外の拡張)。LINE等での紹介リンク共有時の表示に使う。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="千ノ国" />
    <meta property="og:title" content="千ノ国" />
    <meta property="og:description" content="千ノ国 評議員デジタル会員証のお申し込みはこちら" />
    <meta property="og:url" content="https://sengoku-rr.com/" />
    <meta property="og:image" content="https://sengoku-rr.com/ogp-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="千ノ国" />
    <meta name="twitter:description" content="千ノ国 評議員デジタル会員証のお申し込みはこちら" />
    <meta name="twitter:image" content="https://sengoku-rr.com/ogp-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
