name: CI

on:
  push:
    # 本番安定化指示書Stage12(15.2): mainブランチを作成済みだが、GitHub既定ブランチ・
    # Vercel Production Branch・branch protectionの切り替えは実際の管理者権限操作を伴うため、
    # 移行が完了するまでの間はclaude/confirmation-needed-3wicju側のpushでもCIを実行し続ける
    # (切り替え完了後、このブランチ名は削除してよい)。
    branches: [main, claude/confirmation-needed-3wicju]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sengoku_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sengoku_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sengoku_ci
      JWT_SECRET: ci-test-secret-value-that-is-long-enough-for-validation
      TERMS_VERSION: 2026-07-01
      APP_URL: http://localhost:5173
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: echo "RATE_LIMIT_HASH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: server
      # 本番安定化指示書Stage12(15.3「migration drift check」): schema.prismaに対して
      # migrationファイルが不足している状態(このリポジトリで実際に発生した本番障害の原因)を
      # マージ前に検知する。migrationsを再生した結果とschema.prismaが一致しない場合、
      # --exit-codeにより非ゼロ終了する。
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        working-directory: server
      - run: npx tsx prisma/seed.ts
        working-directory: server
      - run: npx tsc -b --noEmit
        working-directory: server
      - run: npx vitest run
        working-directory: server
      # 残課題指示書Stage1: api/index.ts(Vercelエントリポイント)はserver/tsconfig.jsonの対象外
      # (rootDir制約でserver/src配下しか含められない)のため、api/**とserver/src/**を横断する
      # ルートのtsconfig.jsonで別途typecheckする。
      - run: npm run typecheck:api
      # 残課題指示書Stage2: packages/contractsをbuildし、serverのdist/index.js起動経路
      # (node dist/index.js、Vercelは使わないがローカル/将来のデプロイ方式変更に備える)が
      # コンパイル済み@sengoku/contractsをrequireできることを確認する。
      - run: npm run build:contracts
      - run: npm run build --workspace=server
      # 本番安定化指示書Stage12(15.3「Vercel entry import」): api/index.ts(Vercel
      # サーバーレス関数のエントリポイント)自体が起動時例外なく読み込めることを確認する。
      # RATE_LIMIT_HASH_SECRET等の必須環境変数が新規追加された際、本番デプロイで初めて
      # 気づく(今回実際に発生した障害)のではなく、ここで検知できるようにする。
      - name: Vercel entry (api/index.ts) import check
        run: npx tsx scripts/ci-check-vercel-entry.mjs
      - name: dist起動smoke test・critical E2E・Feature Flag false検証
        working-directory: server
        run: |
          node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "server started successfully from dist/"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "server failed to start from dist/ within timeout"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 0.5
          done
          # 本番安定化指示書Stage12(15.3「追加」): critical E2E・Feature Flag false検証。
          node scripts/ci-critical-smoke.mjs
          SMOKE_STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $SMOKE_STATUS

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
