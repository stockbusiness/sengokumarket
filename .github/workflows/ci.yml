name: CI

on:
  push:
    # 2026-07-22指示書Stage5: 実際のGitHub既定ブランチ/唯一の開発ブランチはmainではなく
    # claude/confirmation-needed-3wicjuであり、push対象がmainのみだとCIが一度も実行されない
    # (実際にGitHub Actionsの実行回数が0件であることを確認済み)。mainブランチ運用への正式統一は
    # Vercel Production Branch・GitHub既定ブランチ・branch protectionの変更を伴うため別途判断が
    # 必要だが、それまでの暫定対応として現行ブランチをpushトリガーに追加する。
    branches: [main, claude/confirmation-needed-3wicju]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sengoku_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sengoku_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sengoku_ci
      JWT_SECRET: ci-test-secret-value-that-is-long-enough-for-validation
      TERMS_VERSION: 2026-07-01
      APP_URL: http://localhost:5173
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: echo "RATE_LIMIT_HASH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx tsx prisma/seed.ts
        working-directory: server
      - run: npx tsc -b --noEmit
        working-directory: server
      - run: npx vitest run
        working-directory: server
      # 残課題指示書Stage1: api/index.ts(Vercelエントリポイント)はserver/tsconfig.jsonの対象外
      # (rootDir制約でserver/src配下しか含められない)のため、api/**とserver/src/**を横断する
      # ルートのtsconfig.jsonで別途typecheckする。
      - run: npm run typecheck:api
      # 残課題指示書Stage2: packages/contractsをbuildし、serverのdist/index.js起動経路
      # (node dist/index.js、Vercelは使わないがローカル/将来のデプロイ方式変更に備える)が
      # コンパイル済み@sengoku/contractsをrequireできることを確認する。
      - run: npm run build:contracts
      - run: npm run build --workspace=server
      - name: dist起動smoke test
        working-directory: server
        run: |
          node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "server started successfully from dist/"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "server failed to start from dist/ within timeout"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
